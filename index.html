<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin Panel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#e8e8f0;font:15px system-ui,sans-serif}a{color:inherit}
#login{max-width:340px;margin:12vh auto;background:#14141f;padding:26px;border-radius:14px;border:1px solid #26263b}
input,select,textarea{width:100%;background:#0e0e17;border:1px solid #2a2a40;color:#e8e8f0;padding:10px;border-radius:8px;font:inherit;margin:4px 0 12px}textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:13px}
label{font-size:13px;color:#9a9ab5;display:block}button,.b{background:#7c3aed;color:#fff;border:0;padding:9px 15px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}.b2{background:#26263b}.bd{background:#be123c}.bs{padding:5px 10px;font-size:13px}
#app{display:none;min-height:100vh}aside{position:fixed;left:0;top:0;bottom:0;width:210px;background:#10101a;border-right:1px solid #22223a;padding:16px;overflow:auto}aside h2{margin:0 0 14px;font-size:18px;color:#f5c451}
aside a{display:block;padding:9px 12px;border-radius:8px;color:#a8a8c4;text-decoration:none;cursor:pointer;margin-bottom:3px}aside a.on,aside a:hover{background:#1d1d30;color:#fff}
main{margin-left:210px;padding:24px;max-width:1100px}@media(max-width:800px){aside{position:static;width:auto;display:flex;flex-wrap:wrap;gap:4px}main{margin:0;padding:14px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.c{background:#14141f;border:1px solid #26263b;border-radius:12px;padding:16px}.c b{font-size:26px;display:block}.c span{color:#9a9ab5;font-size:13px}
table{width:100%;border-collapse:collapse;background:#14141f;border-radius:12px;overflow:hidden}th,td{padding:10px;text-align:left;border-bottom:1px solid #22223a;font-size:14px}th{color:#9a9ab5;font-size:12px;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.row>*{flex:0 0 auto}.row input,.row select{width:auto;margin:0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.g2{grid-template-columns:1fr}}
.box{background:#14141f;border:1px solid #26263b;border-radius:12px;padding:18px;margin-bottom:16px}.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:#26263b}.pub{background:#064e3b}.dr{background:#78350f}
.bar{display:flex;align-items:flex-end;gap:8px;height:120px}.bar div{flex:1;background:linear-gradient(#a855f7,#6d28d9);border-radius:5px 5px 0 0;position:relative;min-height:3px}.bar small{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px}.bl{display:flex;gap:8px;font-size:11px;color:#9a9ab5}.bl span{flex:1;text-align:center}
.tb{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}.tb button{padding:5px 10px;font-size:13px;background:#26263b}#toast{position:fixed;bottom:20px;right:20px;background:#065f46;padding:10px 18px;border-radius:10px;display:none;z-index:99}h1{margin:0 0 16px;font-size:24px}.hint{color:#8d8da6;font-size:12px;margin:-8px 0 12px}</style></head><body>
<div id="login"><h2 style="margin-top:0">🔐 Admin Login</h2><label>ID</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()" style="width:100%">Login</button><p id="le" style="color:#f87171"></p></div>
<div id="app"><aside><h2>⚙ Admin</h2><div id="nav"></div></aside><main id="main"></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
async function api(p,method='GET',body){const r=await fetch('/api/'+p,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status==401){showLogin();throw 0}return r.json()}
function showLogin(){$('#login').style.display='block';$('#app').style.display='none'}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:$('#lu').value,pass:$('#lp').value})});const d=await r.json();if(d.ok)start();else $('#le').textContent=d.error}
async function logout(){await fetch('/api/logout');showLogin()}
const NAV=[['dash','📊 Dashboard'],['posts','📝 Posts'],['edit','➕ New Post'],['cats','🗂 Categories'],['pages','📄 Pages'],['ads','💰 Ads Manager'],['settings','⚙ Settings'],['tools','🧰 Tools']];
function nav(a){$('#nav').innerHTML=NAV.map(([k,l])=>`<a class="${k==a?'on':''}" onclick="go('${k}')">${l}</a>`).join('')+'<a href="/" target="_blank">🌐 View Site</a><a onclick="logout()">🚪 Logout</a>'}
function go(k,arg){nav(k);({dash,posts,edit,cats,pages,ads,settings,tools})[k](arg)}
async function start(){$('#login').style.display='none';$('#app').style.display='block';go('dash')}
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const M=h=>$('#main').innerHTML=h;
/* Dashboard */
async function dash(){const d=await api('admin/stats');const mx=Math.max(1,...d.series.map(x=>x.n));
M(`<h1>Dashboard</h1><div class="cards"><div class="c"><b>${d.total.n}</b><span>Total posts</span></div><div class="c"><b>${d.total.pub||0}</b><span>Published</span></div><div class="c"><b>${d.total.dr||0}</b><span>Drafts</span></div><div class="c"><b>${d.scheduled}</b><span>Scheduled</span></div><div class="c"><b>${d.total.v}</b><span>Total views (unique IP)</span></div><div class="c"><b>${d.today}</b><span>Views today</span></div></div>
<div class="g2"><div class="box"><h3>Views – last 7 days</h3><div class="bar">${d.series.map(x=>`<div style="height:${x.n/mx*100}%"><small>${x.n}</small></div>`).join('')}</div><div class="bl">${d.series.map(x=>`<span>${x.day.slice(5)}</span>`).join('')}</div></div>
<div class="box"><h3>🔥 Top posts</h3>${d.top.map(t=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><a href="#" onclick="go('edit',${t.id})">${E(t.title)}</a><b>${t.views}</b></div>`).join('')||'—'}</div></div>
<div class="g2"><div class="box"><h3>Category stats</h3>${d.bycat.map(c=>`<div style="display:flex;justify-content:space-between;padding:6px 0"><span>${E(c.name)}</span><span>${c.posts} posts • ${c.views} views</span></div>`).join('')}</div>
<div class="box"><h3>Recent posts</h3>${d.recent.map(t=>`<div style="padding:6px 0"><a href="#" onclick="go('edit',${t.id})">${E(t.title)}</a> <span class="tag ${t.status=='published'?'pub':'dr'}">${t.status}</span></div>`).join('')}</div></div>`)}
/* Posts list */
async function posts(){const cats=await api('admin/categories');M(`<h1>Posts</h1><div class="row"><input id="q" placeholder="Search title..." oninput="loadPosts()"><select id="st" onchange="loadPosts()"><option value="">All status</option><option>published</option><option>draft</option></select><select id="ct" onchange="loadPosts()"><option value="">All categories</option>${cats.map(c=>`<option value="${c.id}">${E(c.name)}</option>`).join('')}</select><a class="b" onclick="go('edit')">+ New</a></div>
<div class="row"><select id="bk"><option value="">Bulk action…</option><option value="publish">Publish</option><option value="draft">Make draft</option><option value="feature">Feature</option><option value="unfeature">Unfeature</option><option value="delete">Delete</option></select><button class="b2 bs" onclick="bulk()">Apply to selected</button></div><div id="pl"></div>`);loadPosts()}
async function loadPosts(){const r=await api(`admin/posts?q=${encodeURIComponent($('#q').value)}&status=${$('#st').value}&cat=${$('#ct').value}`);const now=new Date().toISOString();
$('#pl').innerHTML=`<table><tr><th><input type="checkbox" style="width:auto;margin:0" onchange="document.querySelectorAll('.ck').forEach(c=>c.checked=this.checked)"></th><th>Title</th><th>Category</th><th>Status</th><th>Views</th><th></th></tr>${r.map(p=>`<tr><td><input class="ck" type="checkbox" value="${p.id}" style="width:auto;margin:0"></td><td>${p.featured?'⭐ ':''}${E(p.title)}</td><td>${E(p.cname||'—')}</td><td><span class="tag ${p.status=='published'?'pub':'dr'}">${p.status=='published'&&p.published_at>now?'scheduled':p.status}</span></td><td>${p.views}</td><td style="white-space:nowrap"><a class="b bs" onclick="go('edit',${p.id})">Edit</a> <a class="b b2 bs" href="/post/${p.slug}" target="_blank">View</a> <a class="b b2 bs" onclick="dup(${p.id})">Copy</a> <a class="b bd bs" onclick="del(${p.id})">✕</a></td></tr>`).join('')}</table>`}
async function bulk(){const ids=[...document.querySelectorAll('.ck:checked')].map(c=>c.value),a=$('#bk').value;if(!ids.length||!a)return toast('Select posts and an action');if(a=='delete'&&!confirm('Delete '+ids.length+' posts?'))return;await api('admin/posts/bulk','POST',{ids,action:a});toast('Done');loadPosts()}
async function del(id){if(confirm('Delete this post?')){await api('admin/posts/'+id,'DELETE');loadPosts()}}
async function dup(id){await api(`admin/posts/${id}/dup`,'POST',{});toast('Copied as draft');loadPosts()}
/* Editor */
let curId=0;
async function edit(id){curId=id||0;const cats=await api('admin/categories');const p=id?await api('admin/posts/'+id):{status:'draft',featured:0,content:'',published_at:new Date().toISOString()};
const loc=d=>{const t=new Date(d);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,16)};
M(`<h1>${id?'Edit':'New'} Post</h1><div class="g2" style="grid-template-columns:2fr 1fr;align-items:start"><div class="box"><label>Title</label><input id="f_title" value="${E(p.title)}" oninput="if(!curId&&!window.sl)$('#f_slug').value=slug(this.value)"><label>Slug (URL)</label><input id="f_slug" value="${E(p.slug)}" oninput="window.sl=1">
<label>Content (HTML)</label><div class="tb">${[['H2','<h2>|</h2>'],['H3','<h3>|</h3>'],['B','<strong>|</strong>'],['I','<em>|</em>'],['Link','<a href="https://">|</a>'],['Image','<img src="|" alt="">'],['List','<ul>\n<li>|</li>\n</ul>'],['Quote','<blockquote>|</blockquote>'],['P','<p>|</p>']].map(([l,t])=>`<button type="button" onclick="ins(this.dataset.t)" data-t="${E(t)}">${l}</button>`).join('')}<button type="button" onclick="prev()" style="background:#0e7490">👁 Preview</button></div>
<textarea id="f_content" style="min-height:420px" oninput="cnt()">${E(p.content)}</textarea><div class="hint" id="wc"></div><div id="pv" style="display:none;background:#fff;color:#111;padding:20px;border-radius:10px;margin-bottom:12px"></div>
<label>Excerpt (short summary shown on cards)</label><textarea id="f_excerpt" style="min-height:60px">${E(p.excerpt)}</textarea></div>
<div><div class="box"><label>Status</label><select id="f_status"><option value="draft" ${p.status=='draft'?'selected':''}>Draft</option><option value="published" ${p.status=='published'?'selected':''}>Published</option></select>
<label>Publish date (future = scheduled)</label><input type="datetime-local" id="f_date" value="${loc(p.published_at||new Date())}"><label>Category</label><select id="f_cat"><option value="">— none —</option>${cats.map(c=>`<option value="${c.id}" ${p.category_id==c.id?'selected':''}>${c.emoji} ${E(c.name)}</option>`).join('')}</select>
<label>Cover image URL</label><input id="f_cover" value="${E(p.cover)}"><label>Tags (comma separated)</label><input id="f_tags" value="${E(p.tags)}"><label><input type="checkbox" id="f_feat" style="width:auto;margin:0 6px 0 0" ${p.featured?'checked':''}>⭐ Featured on homepage</label><br>
<button class="b" onclick="savePost()" style="width:100%">💾 Save</button>${id?`<p><a class="b b2 bs" href="/post/${p.slug}" target="_blank">View</a> <a class="b b2 bs" onclick="resetV(${id})">Reset views (${p.views})</a></p>`:''}</div>
<div class="box"><h4 style="margin-top:0">SEO</h4><label>SEO title</label><input id="f_st" value="${E(p.seo_title)}"><label>Meta description</label><textarea id="f_sd" style="min-height:70px">${E(p.seo_desc)}</textarea></div></div></div>`);cnt()}
const slug=s=>s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function ins(t){const a=$('#f_content'),s=a.selectionStart,e=a.selectionEnd,sel=a.value.slice(s,e);a.setRangeText(t.replace('|',sel),s,e,'end');a.focus();cnt()}
function prev(){const v=$('#pv');v.style.display=v.style.display=='none'?'block':'none';v.innerHTML=$('#f_content').value}
function cnt(){const w=$('#f_content').value.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length;$('#wc').textContent=w+' words • ~'+Math.max(1,Math.round(w/200))+' min read'}
async function savePost(){const b={title:$('#f_title').value,slug:$('#f_slug').value,content:$('#f_content').value,excerpt:$('#f_excerpt').value,status:$('#f_status').value,category_id:$('#f_cat').value,cover:$('#f_cover').value,tags:$('#f_tags').value,featured:$('#f_feat').checked,seo_title:$('#f_st').value,seo_desc:$('#f_sd').value,published_at:$('#f_date').value?new Date($('#f_date').value).toISOString():''};
if(!b.title)return toast('Title required');if(curId){await api('admin/posts/'+curId,'PUT',b);toast('Saved ✓')}else{const r=await api('admin/posts','POST',b);toast('Created ✓');go('edit',r.id)}}
async function resetV(id){if(confirm('Reset views to 0?')){await api(`admin/posts/${id}/reset-views`,'POST',{});go('edit',id)}}
/* Categories */
async function cats(){const r=await api('admin/categories');M(`<h1>Categories</h1><div class="box"><h3 style="margin-top:0">Add new</h3><div class="row"><input id="n_emoji" placeholder="Emoji" style="width:70px"><input id="n_name" placeholder="Name"><input id="n_desc" placeholder="Description" style="width:300px"><button class="b" onclick="addCat()">Add</button></div></div>
<table><tr><th>Emoji</th><th>Name</th><th>Description</th><th>Sort</th><th>Posts</th><th></th></tr>${r.map(c=>`<tr><td><input id="e${c.id}" value="${E(c.emoji)}" style="width:60px;margin:0"></td><td><input id="n${c.id}" value="${E(c.name)}" style="margin:0"></td><td><input id="d${c.id}" value="${E(c.description)}" style="margin:0"></td><td><input id="o${c.id}" value="${c.sort}" style="width:60px;margin:0"></td><td>${c.posts}</td><td style="white-space:nowrap"><button class="b bs" onclick="saveCat(${c.id},'${c.slug}')">Save</button> <button class="b bd bs" onclick="delCat(${c.id})">✕</button></td></tr>`).join('')}</table>`)}
async function addCat(){await api('admin/categories','POST',{name:$('#n_name').value,emoji:$('#n_emoji').value,description:$('#n_desc').value});cats()}
async function saveCat(id,s){await api('admin/categories/'+id,'PUT',{name:$('#n'+id).value,slug:s,emoji:$('#e'+id).value,description:$('#d'+id).value,sort:$('#o'+id).value});toast('Saved ✓')}
async function delCat(id){if(confirm('Delete category? Posts stay uncategorized.')){await api('admin/categories/'+id,'DELETE');cats()}}
/* Pages */
async function pages(){const r=await api('admin/pages');window._pg=r;M(`<h1>Pages</h1><p class="hint">Privacy Policy, About, Contact, Disclaimer — needed for AdSense approval. They show in the footer.</p><div class="row"><button class="b" onclick="pageForm()">+ New page</button></div><table><tr><th>Title</th><th>URL</th><th></th></tr>${r.map(p=>`<tr><td>${E(p.title)}</td><td>/p/${p.slug}</td><td><button class="b bs" onclick="pageForm(${p.id})">Edit</button> <button class="b bd bs" onclick="delPage(${p.id})">✕</button></td></tr>`).join('')}</table><div id="pf"></div>`)}
function pageForm(id){const p=(window._pg||[]).find(x=>x.id==id)||{title:'',slug:'',content:'',in_footer:1};window._pid=id;$('#pf').innerHTML=`<div class="box" style="margin-top:16px"><label>Title</label><input id="p_t" value="${E(p.title)}"><label>Slug</label><input id="p_s" value="${E(p.slug)}"><label>Content (HTML)</label><textarea id="p_c" style="min-height:260px">${E(p.content)}</textarea><label><input type="checkbox" id="p_f" style="width:auto;margin:0 6px 0 0" ${p.in_footer?'checked':''}>Show in footer</label><br><button class="b" onclick="savePage()">Save page</button></div>`;$('#pf').scrollIntoView()}
async function savePage(){const b={title:$('#p_t').value,slug:$('#p_s').value,content:$('#p_c').value,in_footer:$('#p_f').checked};if(window._pid)await api('admin/pages/'+window._pid,'PUT',b);else await api('admin/pages','POST',b);toast('Saved ✓');pages()}
async function delPage(id){if(confirm('Delete page?')){await api('admin/pages/'+id,'DELETE');pages()}}
/* Settings forms */
const ADS=[
['_h','⚙ MASTER','h'],['ads_enabled','Ads ON/OFF (sab ads aik saath)','toggle','Band karne par Monetag, Adsterra aur custom sab ads hat jate hain'],
['_h','🟦 MONETAG','h'],['mt_enabled','Monetag ON/OFF','toggle','Sirf Monetag ke ads band/chalu karta hai'],
['mt_multitag','Multitag (all-in-one)','code','Sab formats aik script mein. Multitag lagayen to neeche Onclick/Vignette/In-Page alag se na lagayen. Har page par chalta hai'],
['mt_onclick','Onclick (Popunder)','code','Click par popunder. Har page par chalta hai'],
['mt_vignette','Vignette banner','code','Har page par chalta hai'],
['mt_inpage','In-Page Push (Banner)','code','Har page par chalta hai'],
['mt_push','Push Notifications','code','sw.js file GitHub ke public folder mein upload karna zaroori. Script har page par chalta hai'],
['mt_direct_url','Direct Link URL','text','Post ke neeche button ban kar aata hai. Khali = band'],
['mt_direct_text','Direct Link button ka text','text',''],
['_h','🟧 ADSTERRA','h'],['ast_enabled','Adsterra ON/OFF','toggle','Sirf Adsterra ke ads band/chalu karta hai'],
['ast_social','Social Bar','code','Har page par chalta hai'],
['ast_native','Native Banner','code','Post ke baad aur posts ki list ke beech mein'],
['ast_728x90','Banner 728x90','code','Sirf desktop par, har page ke upar (header)'],
['ast_320x50','Banner 320x50','code','Sirf mobile par, har page ke upar (header)'],
['ast_468x60','Banner 468x60','code','Sirf desktop par, post title ke neeche'],
['ast_300x250','Banner 300x250','code','Post ke content ke andar (desktop aur mobile dono)'],
['ast_160x600','Banner 160x600','code','Sirf desktop par, post ke sidebar mein'],
['ast_160x300','Banner 160x300','code','Post ke sidebar mein (mobile par content ke neeche)'],
['_h','🟩 CUSTOM / ADSENSE / KOI BHI NETWORK','h'],
['ad_header','Header ad (har page ke upar)','code','Har device par'],['ad_below_title','Post title ke neeche','code',''],['ad_in_content','Post content ke andar','code',''],['incontent_after','…kaun se paragraph ke baad (number)','num','Monetag/Adsterra ka 300x250 bhi isi jagah aata hai'],
['ad_after_content','Post content ke baad','code',''],['ad_sidebar','Sidebar ad','code',''],['ad_between','Posts ke beech (home/category)','code',''],['between_every','…har kitni posts ke baad (number)','num',''],
['ad_footer','Footer ad','code',''],['ad_sticky_bottom','Sticky bottom bar ad','code','Neeche chipka hua banner'],['body_end_code','Extra script (</body> se pehle)','code','Koi bhi aur network ka global script'],
['_h','🔎 VERIFICATION / ADS.TXT','h'],['head_code','Head code (meta tag verification, analytics)','code','Har page par chalta hai, ads OFF ho tab bhi'],['ads_txt','ads.txt content','code','/ads.txt par dikhta hai']];
const SET=[['site_name','Site name','text'],['tagline','Tagline','text'],['site_url','Site URL (https://yourdomain.com — for sitemap/SEO)','text'],['home_title','Homepage SEO title','text'],['home_desc','Homepage meta description','text'],['accent','Accent color','color'],['accent2','Gold color','color'],['posts_per_page','Posts per page','num'],['show_views','Show view count on posts (1/0)','num'],['count_admin_views','Count admin\'s own views (1/0)','num'],['footer_text','Footer text ({year} = current year)','text'],['robots_extra','Extra robots.txt lines','code'],['twitter','X/Twitter URL','text'],['facebook','Facebook URL','text'],['instagram','Instagram URL','text'],['youtube','YouTube URL','text'],['tiktok','TikTok URL','text'],['telegram','Telegram URL','text']];
function form(F,S){return F.map(([k,l,t,h])=>t=='h'?`<h3 style="margin:26px 0 10px;padding-top:14px;border-top:1px solid #26263b">${l}</h3>`:t=='toggle'?`<label><input type="checkbox" id="s_${k}" style="width:auto;margin:0 8px 0 0" ${S[k]=='1'?'checked':''}><b>${l}</b></label><div class="hint">${h||''}</div>`:`<label>${l}</label>${t=='code'?`<textarea id="s_${k}">${E(S[k])}</textarea>`:`<input id="s_${k}" type="${t=='color'?'color':'text'}" value="${E(S[k])}">`}${h?`<div class="hint">${h}</div>`:''}`).join('')}
async function saveS(F){const b={};F.forEach(([k,,t])=>{if(t!='h')b[k]=t=='toggle'?($('#s_'+k).checked?'1':'0'):$('#s_'+k).value});await api('admin/settings','PUT',b);toast('Saved ✓')}
async function ads(){const S=await api('admin/settings');window._F=ADS;M(`<h1>💰 Ads Manager</h1><p class="hint">Paste your ad code (AdSense, Adsterra, any network) in the slot you want. Leave empty = no ad there.</p><div class="box">${form(ADS,S)}<button class="b" onclick="saveS(ADS)">Save ads</button></div>`)}
async function settings(){const S=await api('admin/settings');M(`<h1>⚙ Settings</h1><div class="box">${form(SET,S)}<button class="b" onclick="saveS(SET)">Save settings</button></div>`)}
async function tools(){M(`<h1>🧰 Tools</h1><div class="box"><h3 style="margin-top:0">Backup</h3><p class="hint">Download all posts, categories, pages and settings as JSON.</p><button class="b" onclick="backup()">⬇ Download backup</button></div><div class="box"><h3 style="margin-top:0">Reset all views</h3><button class="b bd" onclick="rall()">Reset every view counter</button></div><div class="box"><h3 style="margin-top:0">Links</h3><p><a href="/sitemap.xml" target="_blank">sitemap.xml</a> • <a href="/robots.txt" target="_blank">robots.txt</a> • <a href="/ads.txt" target="_blank">ads.txt</a></p></div>`)}
async function backup(){const d=await api('admin/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:'application/json'}));a.download='backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function rall(){if(confirm('Reset ALL views?')){await api('admin/reset-all-views','POST',{});toast('Done')}}
fetch('/api/admin/me').then(r=>r.status==200?start():showLogin());
</script></body></html>
